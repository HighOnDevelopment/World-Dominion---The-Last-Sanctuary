# T07: build the game and publish it to GitHub Pages.
#
# - Every pull request: install, typecheck and build (a check that must pass).
# - Every push to main: the same, then publish the site.
# Live link: https://highondevelopment.github.io/World-Dominion---The-Last-Sanctuary/
#
# One-time setup (repo admin): Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
# To freeze the live build after submitting (T54): Actions -> this workflow ->
# "..." -> Disable workflow.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts skips optional tooling downloads (AI search model,
      # headset CLI) that the website itself does not need.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NODE_ENV: production
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
